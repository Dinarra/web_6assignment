<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Part 2. jQuery Effects</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Part 1: Basics</a>
    <a href="effects.html" class="active">Part 2: Effects</a>
    <a href="dom.html">Part 3: DOM</a>
    <a href="animations.html">Part 4: Animations</a>
  </nav>

  <main>
    <h1>Part 2. jQuery Effects</h1>

    <section>
      <h2>Task 2. Visibility Methods</h2>
      <p id="para">This paragraph can be hidden, shown or toggled.</p>
      <button id="hide">Hide</button>
      <button id="show">Show</button>
      <button id="toggle">Toggle</button>
    </section>

    <section>
      <h2>Task 3. Fade Methods</h2>
      <img id="fadeImg" src="img/img1.svg" alt="Fade image" width="300">
      <button id="fIn">fadeIn()</button>
      <button id="fOut">fadeOut()</button>
      <button id="fToggle">fadeToggle()</button>
    </section>

    <section>
      <h2>Task 4. Slide Methods</h2>
      <button id="sUp">slideUp()</button>
      <button id="sDown">slideDown()</button>
      <button id="sToggle">slideToggle()</button>
      <div id="panel">
        <h3>Collapsible panel</h3>
        <p>This is the content of the panel. It slides up and down.</p>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
